spring.datasource.url=${DB_URL:jdbc:mysql://mysql-167744fb-resq-project.i.aivencloud.com:23250/resq_db?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

# HU-20: correo de confirmacion. El servidor SMTP se configura con variables de entorno
# (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
# Sin SPRING_MAIL_HOST no se envia nada: el correo solo se escribe en el log del backend.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
resq.mail.remitente=${MAIL_FROM:no-reply@resq.local}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.application.name=resq-backend

# HU-10: fotografias de los reportes
# Spring limita por defecto a 1MB; se sube a 5MB (debe coincidir con resq.fotos.max-bytes).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
resq.fotos.max-bytes=5242880
resq.fotos.directorio=${FOTOS_DIR:uploads/reportes}

# HU-23: firma de los tokens JWT. El valor por defecto es solo para desarrollo local;
# en produccion hay que exportarlo por entorno (JWT_SECRET) con una clave propia.
app.jwt.secret=${JWT_SECRET:resq-clave-de-desarrollo-cambiala-en-produccion-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
