# Configuracion para los tests.
#
# Spring Boot solo lee el primer application.properties que encuentra en el
# classpath, y target/test-classes va antes que target/classes. Por eso este
# archivo REEMPLAZA al de src/main/resources y hay que repetir aca la
# configuracion de la base de datos.
#
# Lo que si cambia respecto a produccion es spring.sql.init.mode: en la app
# vale "always" y data.sql corre en cada arranque, asi que una corrida de tests
# escribiria el seed de coordenadas en la base de datos compartida del equipo.
# En "never" los tests no tocan los datos.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-167744fb-resq-project.i.aivencloud.com:23250/resq_db?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.application.name=resq-backend-test
